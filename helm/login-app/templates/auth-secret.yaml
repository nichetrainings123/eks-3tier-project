{{- $existingSecret := lookup "v1" "Secret" .Values.namespace "app-auth-secret" -}}
{{- $existingKey := "" -}}
{{- if $existingSecret -}}
{{- $existingKey = (index $existingSecret.data "FLASK_SECRET_KEY" | b64dec) -}}
{{- end -}}
{{- $secretKey := .Values.auth.sessionSecret | default $existingKey | default (randAlphaNum 64) -}}
apiVersion: v1
kind: Secret
metadata:
  name: app-auth-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  FLASK_SECRET_KEY: {{ $secretKey | quote }}
