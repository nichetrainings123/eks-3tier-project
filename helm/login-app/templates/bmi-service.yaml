apiVersion: v1
kind: Service
metadata:
  name: bmi-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: bmi-service
  ports:
    - name: http
      port: {{ .Values.bmiApp.service.port }}
      targetPort: {{ .Values.bmiApp.service.targetPort }}
      protocol: TCP
