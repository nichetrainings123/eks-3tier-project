namespace: training

auth:
  sessionSecret: ""

postgres:
  image: postgres:16
  replicas: 1

  database: trainingdb
  username: admin
  password: Password@123

  storage:
    size: 20Gi
    storageClass: gp3

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

loginApp:
  replicas: 2

  image:
    repository: 797894062399.dkr.ecr.us-east-1.amazonaws.com/login-app
    tag: "60d3c7f9417a857f6d6b11a47939712d1067bc50"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80
    targetPort: 5000

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

bmiApp:
  replicas: 2

  image:
    repository: 797894062399.dkr.ecr.us-east-1.amazonaws.com/bmi-service
    tag: "60d3c7f9417a857f6d6b11a47939712d1067bc50"
    pullPolicy: Always

  service:
    port: 80
    targetPort: 5001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
