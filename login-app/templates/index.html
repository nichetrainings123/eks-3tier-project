 <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:360px;
            background:#ffffff;
            padding:30px;
            border-radius:12px;
            box-shadow:0px 10px 30px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#eb2535;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #d1d5db;
            border-radius:6px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        hr{
            margin:25px 0;
        }

        p{
            text-align:center;
            color:#64748b;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>AWS EKS Login Portal</h2>

    <p>Register New User</p>

    <form action="/register" method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Register</button>

    </form>

    <hr>

    <p>Login Existing User</p>

    <form action="/login" method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
