name: Build, push, and deploy application

on:
  push:
    branches:
      - main
      - dev
      - test
      - prod
    paths-ignore:
      - helm/login-app/values.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: 797894062399
      ECR_REPOSITORY: login-app
      BMI_ECR_REPOSITORY: bmi-service
      IMAGE_TAG: ${{ github.sha }}
      TARGET_NAMESPACE: ${{ github.ref_name == 'main' && 'training' || github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate environment variables
        run: |
          test -n "$EKS_CLUSTER_NAME" || { echo "Set EKS_CLUSTER_NAME in the GitHub environment variables."; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "Set POSTGRES_PASSWORD in the GitHub environment secrets."; exit 1; }
          test -n "$SESSION_SECRET" || { echo "Set SESSION_SECRET in the GitHub environment secrets."; exit 1; }
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR Repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"
          aws ecr describe-repositories \
            --repository-names "$BMI_ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$BMI_ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            -f ./login-app/Dockerfile \
            ./login-app
          docker build \
            -t "$BMI_ECR_REPOSITORY:$IMAGE_TAG" \
            -f ./bmi-service/Dockerfile \
            ./bmi-service

      - name: Tag Docker Image
        run: |
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"
          docker tag "$BMI_ECR_REPOSITORY:$IMAGE_TAG" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BMI_ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$BMI_ECR_REPOSITORY:$IMAGE_TAG" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BMI_ECR_REPOSITORY:latest"

      - name: Push Docker Images to ECR
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BMI_ECR_REPOSITORY:$IMAGE_TAG"
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BMI_ECR_REPOSITORY:latest"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Deploy to environment namespace
        run: |
          helm_args=(
            upgrade --install login-app ./helm/login-app
            --namespace "$TARGET_NAMESPACE"
            --create-namespace
            --take-ownership
            --wait
            --timeout 10m
            --set-string "namespace=$TARGET_NAMESPACE"
            --set-string "loginApp.image.tag=$IMAGE_TAG"
            --set-string "bmiApp.image.tag=$IMAGE_TAG"
          )

          if [[ "$TARGET_NAMESPACE" != "training" ]]; then
            helm_args+=(
              --set-string "gateway.selector=ingressgateway-$TARGET_NAMESPACE"
              --set "loginApp.replicas=1"
              --set "bmiApp.replicas=1"
              --set-string "postgres.storage.storageClass=gp3-$TARGET_NAMESPACE"
            )
          fi

          helm "${helm_args[@]}"
