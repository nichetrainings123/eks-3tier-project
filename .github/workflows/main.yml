name: Build, Push to ECR and Update Kubernetes Manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: 797894062399
      ECR_REPOSITORY: login-app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Configure AWS Credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Create ECR Repository if it does not exist
      # --------------------------------------------------
      - name: Create ECR Repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      # --------------------------------------------------
      # 4. Login to ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 5. Build Docker Image
      # --------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            -f ./login-app/Dockerfile \
            ./login-app

      # --------------------------------------------------
      # 6. Tag Docker Image
      # --------------------------------------------------
      - name: Tag Docker Image
        run: |
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

      # --------------------------------------------------
      # 7. Push Image to ECR
      # --------------------------------------------------
      - name: Push Docker Images to ECR
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

      # --------------------------------------------------
      # 8. Update Helm Chart Values
      # --------------------------------------------------
      - name: Update Helm Image Tag
        run: |
          sed -i "s|^[[:space:]]*tag: .*|    tag: \"$IMAGE_TAG\"|" helm/login-app/values.yaml

          echo "Updated values.yaml:"
          grep -n "tag:" helm/login-app/values.yaml

      # --------------------------------------------------
      # 9. Commit and Push Updated Manifest
      # --------------------------------------------------
      - name: Commit and Push Updated Deployment YAML
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/login-app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update image to $IMAGE_TAG"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
